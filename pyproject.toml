[project]
# Il nome sul pacchetto e' "vedit-mcp" e non "vedit" perche' su PyPI "vedit" era
# gia' preso da un altro progetto. Non e' solo un ripiego: coincidendo con il
# comando del server MCP, `uvx vedit-mcp` funziona senza --from, ed e' la riga
# che si incolla nella configurazione di qualunque client. Il modulo Python
# importabile resta `vedit`.
name = "vedit-mcp"
version = "0.1.2"
description = "Non-linear video editor an AI agent can actually drive (MCP), with a web UI. Timeline -> ffmpeg."
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "video", "video-editing", "video-editor", "ffmpeg", "mcp",
    "model-context-protocol", "timeline", "nle", "ai-agent", "claude",
    "automation", "keyframes", "ai-video-editor", "claude-code", "cursor",
    "llm", "subtitles", "agentic-ai",
]
authors = [{ name = "metiu1" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Italian",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = [
    "mcp>=1.2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    # non e' un extra: senza numpy restano fuori music_beats, plan_edit,
    # inspect_footage, match_color e check_cuts, cioe' tutta la parte che
    # sceglie il materiale e monta a tempo. Lo usano analyze, colormatch,
    # review e vision.
    "numpy>=1.24",
    # preview_grid e color_scopes: guardare il montaggio non e' un accessorio,
    # e' la regola prima delle istruzioni MCP. Senza Pillow crashano.
    "pillow>=10.0",
    # importato direttamente da mcp_server, non solo di rimbalzo da mcp
    "anyio>=4.0",
]

[project.urls]
Homepage = "https://github.com/metiutek/editorvideo-ai"
Source = "https://github.com/metiutek/editorvideo-ai"
Issues = "https://github.com/metiutek/editorvideo-ai/issues"
Documentation = "https://github.com/metiutek/editorvideo-ai#readme"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# serve solo per l'assistente dentro la UI; senza, il resto funziona uguale
chat = ["anthropic>=0.40"]
# riconoscimento del soggetto (YOLO): si tira dietro torch, sono giga. Resta
# facoltativo apposta — senza, detect_subjects/track_mask/auto_reframe dicono
# come installarlo e il resto dell'editor non se ne accorge.
vision = ["ultralytics>=8.3"]
# trascrizione e sottotitoli: scarica un modello e macina CPU, quindi non e'
# di serie. Senza, transcribe/make_captions/tighten_speech/censor_speech
# dicono cosa installare.
transcribe = ["faster-whisper>=1.0"]
# clip html: Chromium fotografa la grafica fotogramma per fotogramma al render.
# Usa Chrome o Edge gia' installati; senza, add_html funziona e l'anteprima
# dal vivo pure, ma il render dice cosa installare.
html = ["playwright>=1.40"]
# plugin audio esterni (VST3, AU su Mac): pedalboard li carica, ffmpeg no.
# Senza, l'effetto "vst" dice cosa installare e il resto non cambia.
plugin = ["pedalboard>=0.9"]

[project.scripts]
vedit = "vedit.cli:main"
vedit-mcp = "vedit.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

# L'interfaccia compilata viaggia dentro il pacchetto: chi installa da PyPI non
# ha Node per compilarla. La copia scripts/build_wheel.py da frontend/dist.
[tool.setuptools.package-data]
vedit = ["webui/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: esegue ffmpeg per davvero (render reali)"]
