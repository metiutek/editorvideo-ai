# Pubblicazione su PyPI a ogni tag "vX.Y.Z".
#
# Non serve nessun token: PyPI riconosce questa repo tramite la pubblicazione
# fidata (Trusted Publisher). Da configurare una volta sola su
# pypi.org -> il progetto -> Publishing:
#   owner: metiutek   repo: editorvideo-ai   workflow: release.yml   environment: pypi
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # niente pubblicazione se la suite non passa
  verifica:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verifica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: dipendenze di build
        run: python -m pip install --upgrade build

      # compila l'interfaccia e la copia dentro il pacchetto: senza, chi
      # installa da PyPI si ritrova un editor senza schermo
      - name: costruisci
        run: python scripts/build_wheel.py --keep

      - name: controlla che la UI sia nel pacchetto
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          whl = glob.glob("dist/*.whl")[0]
          nomi = zipfile.ZipFile(whl).namelist()
          if not any(n.endswith("vedit/webui/index.html") for n in nomi):
              sys.exit(f"{whl} non contiene l'interfaccia compilata")
          print(f"{whl}: {len(nomi)} file, interfaccia inclusa")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # serve alla pubblicazione fidata
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
